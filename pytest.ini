[pytest]
minversion = 6.0
addopts = 
    --strict-markers
    --strict-config
    -v
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that take more than a few seconds
    network: Tests that require network access
    ui: Tests that interact with the UI layer
    service: Tests for service layer components
    repository: Tests for repository layer components
    domain: Tests for domain model components
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning